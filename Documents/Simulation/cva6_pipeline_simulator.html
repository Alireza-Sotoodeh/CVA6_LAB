// --- INSTRUCTION PARSER ---

const parseRegister = str => {
  if (!str) return 0;
  const s = str.trim().toLowerCase();
  if (s.startsWith('x')) {
    const num = parseInt(s.substring(1), 10);
    return isNaN(num) ? 0 : num;
  }
  const idx = REGISTER_NAMES.indexOf(s);
  return idx >= 0 ? idx : 0;
};
const parseProgram = source => {
  const lines = source.split('\n');
  const labels = {};
  const rawInsts = [];

  // Pass 1: Collect labels and clean instructions
  let currentPc = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].split('//')[0].split(';')[0].split('#')[0].trim();
    if (!line) continue;
    if (line.endsWith(':')) {
      const label = line.slice(0, -1).trim();
      labels[label] = currentPc;
      continue;
    }
    const match = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*):\s*(.*)$/);
    let instText = line;
    if (match) {
      labels[match[1]] = currentPc;
      instText = match[2].trim();
      if (!instText) continue;
    }
    const isCompressed = instText.toUpperCase().startsWith('C.');
    rawInsts.push({
      line: instText,
      raw: line,
      isCompressed
    });
    currentPc += isCompressed ? 2 : 4;
  }

  // Pass 2: Parse instructions
  const instructions = [];
  let pc = 0;
  let id = 1;
  for (const item of rawInsts) {
    const isCompressed = item.isCompressed;
    const clean = item.line.replace(/,/g, ' ').replace(/\s+/g, ' ').trim();
    const parts = clean.split(' ');
    const op = parts[0].toUpperCase();
    let type = 'ALU';
    let rd = 0,
      rs1 = 0,
      rs2 = 0,
      imm = 0;
    let targetPc = undefined;
    let latency = 1;
    try {
      if (op === 'C.LI') {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        imm = parseInt(parts[2], 10) || 0;
      } else if (op === 'C.MV') {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        rs1 = 0;
        rs2 = parseRegister(parts[2]);
      } else if (op === 'C.ADDI') {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        rs1 = rd;
        imm = parseInt(parts[2], 10) || 0;
      } else if (op === 'C.ADD') {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        rs1 = rd;
        rs2 = parseRegister(parts[2]);
      } else if (['ADD', 'SUB', 'XOR', 'OR', 'AND', 'SLL', 'SRL', 'SRA', 'SLT', 'SLTU'].includes(op)) {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        rs1 = parseRegister(parts[2]);
        rs2 = parseRegister(parts[3]);
        latency = 1;
      } else if (['ADDI', 'XORI', 'ORI', 'ANDI', 'SLLI', 'SRLI', 'SRAI', 'SLTI', 'SLTIU'].includes(op)) {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        rs1 = parseRegister(parts[2]);
        imm = parseInt(parts[3], 10) || 0;
        latency = 1;
      } else if (op === 'LUI' || op === 'AUIPC') {
        type = 'ALU';
        rd = parseRegister(parts[1]);
        imm = parseInt(parts[2], 10) || 0;
      } else if (op === 'MUL' || op === 'MULH' || op === 'MULHU' || op === 'MULHSU') {
        type = 'MUL';
        rd = parseRegister(parts[1]);
        rs1 = parseRegister(parts[2]);
        rs2 = parseRegister(parts[3]);
        latency = 2;
      } else if (op === 'DIV' || op === 'DIVU' || op === 'REM' || op === 'REMU') {
        type = 'DIV';
        rd = parseRegister(parts[1]);
        rs1 = parseRegister(parts[2]);
        rs2 = parseRegister(parts[3]);
        latency = 4;
      } else if (['LW', 'LB', 'LH', 'LBU', 'LHU'].includes(op)) {
        type = 'LSU';
        rd = parseRegister(parts[1]);
        const memMatch = parts[2].match(/(-?\d*)\((.*)\)/);
        if (memMatch) {
          imm = parseInt(memMatch[1], 10) || 0;
          rs1 = parseRegister(memMatch[2]);
        }
        latency = 2;
      } else if (['SW', 'SB', 'SH'].includes(op)) {
        type = 'LSU';
        rs2 = parseRegister(parts[1]);
        const memMatch = parts[2].match(/(-?\d*)\((.*)\)/);
        if (memMatch) {
          imm = parseInt(memMatch[1], 10) || 0;
          rs1 = parseRegister(memMatch[2]);
        }
        latency = 2;
      } else if (['BEQ', 'BNE', 'BLT', 'BGE', 'BLTU', 'BGEU'].includes(op)) {
        type = 'BRANCH';
        rs1 = parseRegister(parts[1]);
        rs2 = parseRegister(parts[2]);
        const label = parts[3];
        if (labels[label] !== undefined) {
          targetPc = labels[label];
        } else {
          targetPc = pc + (parseInt(label, 10) || 4);
        }
        latency = 1;
      } else if (op === 'JAL') {
        type = 'BRANCH';
        rd = parseRegister(parts[1]);
        const label = parts[2];
        targetPc = labels[label] !== undefined ? labels[label] : pc + 4;
        latency = 1;
      } else if (['CSRRW', 'CSRRS', 'CSRRC'].includes(op)) {
        type = 'CSR';
        rd = parseRegister(parts[1]);
        latency = 1;
      } else {
        type = 'ALU';
      }
    } catch (e) {
      console.error("Parse error at line", item.raw, e);
    }
    instructions.push({
      id: id++,
      pc,
      raw: item.raw,
      op,
      type,
      rd,
      rs1,
      rs2,
      imm,
      targetPc,
      isCompressed,
      latency
    });
    pc += isCompressed ? 2 : 4;
  }
  return instructions;
};

// --- SIMULATION STEP ENGINE ---

const stepSimulation = (state, program) => {
  const nextState = {
    ...state,
    cycle: state.cycle + 1,
    registers: [...state.registers],
    dataMemory: {
      ...state.dataMemory
    },
    bht: {
      ...state.bht
    },
    btb: {
      ...state.btb
    },
    ras: [...state.ras],
    feQueue: [...state.feQueue],
    idQueue: [...state.idQueue],
    issueBuffer: [...state.issueBuffer],
    scoreboard: state.scoreboard.map(e => ({
      ...e
    })),
    activeWires: [],
    activeUnits: {},
    stageSnapshot: {},
    logs: [...state.logs],
    stallReason: null,
    status: 'RUNNING'
  };
  const logs = nextState.logs;
  const cycle = nextState.cycle;
  let hasMispredict = false;
  let mispredictRedirectPc = 0;

  // -------------------------------------------------------------
  // PHASE 1: IN-ORDER ARCHITECTURAL COMMIT
  // -------------------------------------------------------------
  if (nextState.scoreboard.length > 0) {
    const head = nextState.scoreboard[0];
    if (head.ready) {
      if (head.rd !== 0) {
        nextState.registers[head.rd] = head.result;
        nextState.activeUnits['REGFILE_WRITE'] = {
          inst: head.inst,
          label: `Write x${head.rd} = ${head.result}`,
          subLabel: `Commit Result`,
          color: '#10b981'
        };
        nextState.activeWires.push('COMMIT_SB_TO_REGFILE');
      } else if (head.inst.type === 'LSU' && head.inst.op.startsWith('S')) {
        nextState.dataMemory[head.result] = head.rs2Val;
        nextState.activeUnits['COMMIT_LOGIC'] = {
          inst: head.inst,
          label: `Store Mem[${head.result}] = ${head.rs2Val}`,
          subLabel: `D$ Commit`,
          color: '#3b82f6'
        };
      }
      nextState.activeUnits['COMMIT_SCOREBOARD'] = {
        inst: head.inst,
        label: `Retire: ${head.inst.op}`,
        subLabel: `TID #${head.transId}`,
        color: '#10b981'
      };
      nextState.activeWires.push('COMMIT_SB_TO_LOGIC');
      nextState.stageSnapshot.commit = `${head.inst.op} (x${head.rd}=${head.result})`;
      nextState.committedCount++;
      logs.unshift({
        cycle,
        text: `[COMMIT] Retired instruction ${head.inst.raw} (TID: ${head.transId}). Result: ${head.result}`,
        type: 'success'
      });
      nextState.scoreboard.shift();
    } else {
      nextState.stageSnapshot.commit = `Waiting: ${head.inst.op} (TID #${head.transId})`;
    }
  }

  // -------------------------------------------------------------
  // PHASE 2: OUT-OF-ORDER EXECUTION & WRITE-BACK (OoO WB)
  // -------------------------------------------------------------
  const executingInsts = [];
  for (const entry of nextState.scoreboard) {
    if (!entry.ready) {
      entry.remainingCycles--;
      executingInsts.push(`${entry.inst.op} (${entry.totalLatency - entry.remainingCycles}/${entry.totalLatency})`);
      let fuUnitKey = 'ALU';
      let fuColor = '#10b981';
      if (entry.fu === 'MUL_DIV') {
        fuUnitKey = 'MUL_DIV';
        fuColor = '#8b5cf6';
        nextState.activeWires.push('EX_PIPE_TO_MULDIV');
      } else if (entry.fu === 'LSU') {
        fuUnitKey = 'LSU';
        fuColor = '#f59e0b';
      } else if (entry.fu === 'BRANCH') {
        fuUnitKey = 'BRANCH_UNIT';
        fuColor = '#ef4444';
        nextState.activeWires.push('EX_PIPE_TO_BRANCH');
      } else if (entry.fu === 'CSR') {
        fuUnitKey = 'CSR_BUFFER';
        fuColor = '#06b6d4';
        nextState.activeWires.push('EX_PIPE_TO_CSR');
      } else {
        nextState.activeWires.push('EX_PIPE_TO_ALU');
      }
      nextState.activeUnits[fuUnitKey] = {
        inst: entry.inst,
        label: `${entry.inst.op}`,
        subLabel: `Cyc ${entry.totalLatency - entry.remainingCycles}/${entry.totalLatency}`,
        color: fuColor
      };
      nextState.activeUnits['EXEC_PIPE'] = {
        label: `Active FU: ${entry.fu}`,
        color: '#3b82f6'
      };
      if (entry.remainingCycles === 0) {
        entry.ready = true;
        let res = 0;
        const op = entry.inst.op;
        const s1 = entry.rs1Val;
        const s2 = entry.rs2Val;
        const imm = entry.inst.imm;
        if (op === 'ADD' || op === 'C.ADD') res = s1 + s2 | 0;else if (op === 'ADDI' || op === 'C.ADDI') res = s1 + imm | 0;else if (op === 'C.LI') res = imm | 0;else if (op === 'C.MV') res = s2 | 0;else if (op === 'SUB') res = s1 - s2 | 0;else if (op === 'XOR') res = s1 ^ s2;else if (op === 'XORI') res = s1 ^ imm;else if (op === 'OR') res = s1 | s2;else if (op === 'ORI') res = s1 | imm;else if (op === 'AND') res = s1 & s2;else if (op === 'ANDI') res = s1 & imm;else if (op === 'SLL') res = s1 << (s2 & 0x1f);else if (op === 'SLLI') res = s1 << (imm & 0x1f);else if (op === 'SRL') res = s1 >>> (s2 & 0x1f) | 0;else if (op === 'SRLI') res = s1 >>> (imm & 0x1f) | 0;else if (op === 'SRA') res = s1 >> (s2 & 0x1f);else if (op === 'SRAI') res = s1 >> (imm & 0x1f);else if (op === 'SLT') res = s1 < s2 ? 1 : 0;else if (op === 'SLTI') res = s1 < imm ? 1 : 0;else if (op === 'MUL') res = Math.imul(s1, s2);else if (op === 'DIV') res = s2 !== 0 ? Math.trunc(s1 / s2) : -1;else if (op === 'LW') res = nextState.dataMemory[s1 + imm] || 0;else if (op === 'SW') res = s1 + imm;
        if (entry.inst.type === 'BRANCH') {
          let taken = false;
          if (op === 'BEQ') taken = s1 === s2;else if (op === 'BNE') taken = s1 !== s2;else if (op === 'BLT') taken = s1 < s2;else if (op === 'BGE') taken = s1 >= s2;else if (op === 'JAL') taken = true;
          const target = entry.inst.targetPc || entry.inst.pc + 4;
          const predictedTaken = (nextState.bht[entry.inst.pc] || 0) >= 2;
          const prevBht = nextState.bht[entry.inst.pc] || 1;
          nextState.bht[entry.inst.pc] = taken ? Math.min(3, prevBht + 1) : Math.max(0, prevBht - 1);
          if (taken !== predictedTaken) {
            hasMispredict = true;
            mispredictRedirectPc = taken ? target : entry.inst.pc + (entry.inst.isCompressed ? 2 : 4);
            nextState.mispredicts++;
            nextState.activeUnits['MISPREDICT_OVAL'] = {
              label: `MISPREDICT!`,
              subLabel: `Redirect -> 0x${mispredictRedirectPc.toString(16)}`,
              color: '#ef4444'
            };
            nextState.activeWires.push('BRANCH_MISPREDICT_REDIRECT');
          }
        }
        entry.result = res;
        if (entry.fu === 'ALU') nextState.activeWires.push('WB_ALU_TO_SB');else if (entry.fu === 'MUL_DIV') nextState.activeWires.push('WB_MULDIV_TO_SB');else if (entry.fu === 'BRANCH') nextState.activeWires.push('WB_BRANCH_TO_SB');else if (entry.fu === 'CSR') nextState.activeWires.push('WB_CSR_TO_SB');
        logs.unshift({
          cycle,
          text: `[OoO WB] ${entry.inst.raw} finished execution and wrote back result (${res}) to Scoreboard TID ${entry.transId} out-of-order!`,
          type: 'info'
        });
      }
    }
  }
  nextState.stageSnapshot.execute = executingInsts.join(', ') || 'Idle';
  if (hasMispredict) {
    nextState.feQueue = [];
    nextState.idQueue = [];
    nextState.issueBuffer = [];
    nextState.pc = mispredictRedirectPc;
    nextState.status = 'FLUSHED';
    logs.unshift({
      cycle,
      text: `[PIPELINE FLUSH] Branch mispredict! Squashed Fetch, Decode, and Issue stages. Redirecting PC to 0x${mispredictRedirectPc.toString(16)}.`,
      type: 'flush'
    });
    return nextState;
  }

  // -------------------------------------------------------------
  // PHASE 3: IN-ORDER ISSUE & SCOREBOARD HAZARD DETECTION
  // -------------------------------------------------------------
  if (nextState.issueBuffer.length > 0) {
    const candidate = nextState.issueBuffer[0];
    nextState.stageSnapshot.issue = `Candidate: ${candidate.op}`;
    if (nextState.scoreboard.length >= 8) {
      nextState.structuralStalls++;
      nextState.stallReason = "Structural Hazard: Scoreboard is Full (8/8 slots)!";
      nextState.status = 'STALLED';
    } else {
      const rawHazard = nextState.scoreboard.find(e => !e.ready && e.rd !== 0 && (e.rd === candidate.rs1 || e.rd === candidate.rs2));
      if (rawHazard) {
        nextState.rawStalls++;
        nextState.stallReason = `RAW Hazard: Stalled waiting for x${rawHazard.rd} from [${rawHazard.inst.raw}]`;
        nextState.status = 'STALLED';
        nextState.activeUnits['ISSUE_READ'] = {
          inst: candidate,
          label: `RAW Stall`,
          subLabel: `Wait for x${rawHazard.rd}`,
          color: '#f59e0b'
        };
        nextState.stageSnapshot.issue = `STALL (wait x${rawHazard.rd})`;
      } else {
        let rs1Val = nextState.registers[candidate.rs1] || 0;
        let rs2Val = nextState.registers[candidate.rs2] || 0;
        for (const e of nextState.scoreboard) {
          if (e.ready && e.rd !== 0) {
            if (e.rd === candidate.rs1) rs1Val = e.result;
            if (e.rd === candidate.rs2) rs2Val = e.result;
          }
        }
        let assignedFu = 'ALU';
        if (candidate.type === 'MUL' || candidate.type === 'DIV') assignedFu = 'MUL_DIV';else if (candidate.type === 'LSU') assignedFu = 'LSU';else if (candidate.type === 'BRANCH') assignedFu = 'BRANCH';else if (candidate.type === 'CSR') assignedFu = 'CSR';
        const newTransId = nextState.scoreboard.length > 0 ? Math.max(...nextState.scoreboard.map(e => e.transId)) + 1 : 1;
        nextState.scoreboard.push({
          transId: newTransId,
          inst: candidate,
          fu: assignedFu,
          rd: candidate.rd,
          rs1Val,
          rs2Val,
          issueCycle: cycle,
          totalLatency: candidate.latency,
          remainingCycles: candidate.latency,
          ready: false,
          result: 0,
          committed: false
        });
        nextState.issueBuffer.shift();
        nextState.activeWires.push('ISS_BUF_TO_READ', 'ISS_READ_TO_PIPE', 'ISS_READ_TO_SB');
        nextState.activeUnits['ISSUE_READ'] = {
          inst: candidate,
          label: `Issue: ${candidate.op}`,
          subLabel: `-> ${assignedFu}`,
          color: '#06b6d4'
        };
        nextState.activeUnits['ISSUE_SCOREBOARD'] = {
          inst: candidate,
          label: `TID #${newTransId}`,
          subLabel: `Alloc Slot`,
          color: '#06b6d4'
        };
        nextState.stageSnapshot.issue = `Issued: ${candidate.op} -> ${assignedFu}`;
        logs.unshift({
          cycle,
          text: `[ISSUE] Dispatched ${candidate.raw} to ${assignedFu} (Latency: ${candidate.latency} cyc, TID: ${newTransId})`,
          type: 'info'
        });
      }
    }
  }

  // -------------------------------------------------------------
  // PHASE 4: INSTRUCTION DECODE (ID)
  // -------------------------------------------------------------
  if (nextState.idQueue.length > 0 && nextState.issueBuffer.length < 3) {
    const decoded = nextState.idQueue.shift();
    nextState.issueBuffer.push(decoded);
    nextState.stageSnapshot.decode = `${decoded.op} (${decoded.isCompressed ? 'RVC' : '32b'})`;
    if (decoded.isCompressed) {
      nextState.activeUnits['COMPRESSED_DECODER'] = {
        inst: decoded,
        label: `RVC Expand`,
        subLabel: `${decoded.op}`,
        color: '#eab308'
      };
      nextState.activeWires.push('ID_QUEUE_TO_COMP', 'ID_COMP_TO_DEC');
    } else {
      nextState.activeUnits['DECODER'] = {
        inst: decoded,
        label: `Decode`,
        subLabel: `${decoded.op}`,
        color: '#eab308'
      };
      nextState.activeWires.push('ID_DEC_TO_ISSUE_BUF');
    }
  }

  // -------------------------------------------------------------
  // PHASE 5: FRONTEND (FETCH & PREDICTION)
  // -------------------------------------------------------------
  if (nextState.feQueue.length > 0 && nextState.idQueue.length < 2) {
    const inst = nextState.feQueue.shift();
    nextState.idQueue.push(inst);
    nextState.activeWires.push('FE_REALIGNER_TO_QUEUE');
    nextState.activeUnits['INSTR_QUEUE'] = {
      inst,
      label: `Queue (${nextState.idQueue.length}/6)`,
      subLabel: `${inst.op}`,
      color: '#10b981'
    };
  }
  if (nextState.feQueue.length < 4) {
    const currentInst = program.find(p => p.pc === nextState.pc);
    if (currentInst) {
      nextState.feQueue.push(currentInst);
      nextState.stageSnapshot.fetch = `0x${nextState.pc.toString(16)}: ${currentInst.op}`;
      nextState.activeUnits['ICACHE'] = {
        inst: currentInst,
        label: `I$ Fetch`,
        subLabel: `0x${nextState.pc.toString(16)}`,
        color: '#10b981'
      };
      nextState.activeUnits['REALIGNER'] = {
        inst: currentInst,
        label: `Realign`,
        subLabel: `${currentInst.op}`,
        color: '#10b981'
      };
      nextState.activeUnits['INSTR_SCAN'] = {
        inst: currentInst,
        label: `Scan`,
        subLabel: `${currentInst.type}`,
        color: '#10b981'
      };
      nextState.activeWires.push('FE_ICACHE_TO_REALIGNER', 'FE_REALIGNER_TO_SCAN');
      let nextPc = nextState.pc + (currentInst.isCompressed ? 2 : 4);
      if (currentInst.type === 'BRANCH') {
        const bhtVal = nextState.bht[currentInst.pc] || 1;
        if (bhtVal >= 2 && currentInst.targetPc !== undefined) {
          nextPc = currentInst.targetPc;
          nextState.activeUnits['BHT'] = {
            label: `BHT: TAKEN`,
            subLabel: `State: ${bhtVal}/3`,
            color: '#10b981'
          };
          nextState.activeUnits['BTB'] = {
            label: `BTB Target`,
            subLabel: `0x${nextPc.toString(16)}`,
            color: '#10b981'
          };
        } else {
          nextState.activeUnits['BHT'] = {
            label: `BHT: NOT TAKEN`,
            subLabel: `State: ${bhtVal}/3`,
            color: '#64748b'
          };
        }
      }
      nextState.pc = nextPc;
    } else if (nextState.feQueue.length === 0 && nextState.idQueue.length === 0 && nextState.issueBuffer.length === 0 && nextState.scoreboard.length === 0) {
      nextState.status = 'DONE';
    }
  }
  return nextState;
};

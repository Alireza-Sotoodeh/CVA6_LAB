    <text x="992" y="108" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Cycles 351 - 415</text>
    <text x="573" y="127" font-size="11" fill="#475569">LW from 0x80000401; data_misaligned=1; mtval=0x80000401; vectored to mtvec</text>

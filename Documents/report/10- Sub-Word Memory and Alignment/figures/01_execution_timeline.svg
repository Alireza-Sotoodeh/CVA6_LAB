    <text x="43" y="212" font-size="11" fill="#475569">SW to 0x80000402; data_misaligned=1; mcause=6; mtval=0x80000402; MRET resumed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="555" y="170" width="510" height="74" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>

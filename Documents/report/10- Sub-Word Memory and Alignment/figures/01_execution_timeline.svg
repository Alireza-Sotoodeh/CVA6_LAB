  <text x="350" y="464" font-size="11" font-weight="600" fill="#0369a1">5.58 Cycles / Instruction</text>
  <text x="650" y="464" font-size="11" fill="#475569">Includes 4 Trap Flushes &amp; Re-Fetches</text>
  <text x="950" y="464" font-size="11" font-weight="700" fill="#16a34a">PASS (Expected for Traps)</text>


  <rect x="27" y="474" width="1046" height="23" fill="#f8fafc"/>
  <text x="45" y="489" font-size="11" font-weight="600" fill="#1e293b">Hardware Alignment Faults</text>
  <text x="350" y="489" font-size="11" font-weight="600" fill="#0369a1">4 Events (2 Load + 2 Store)</text>
  <text x="650" y="489" font-size="11" fill="#475569">LW (0x401), SW (0x402), LH (0x403), SH (0x401)</text>
  <text x="950" y="489" font-size="11" font-weight="700" fill="#16a34a">PASS (100% Detected)</text>


  <rect x="27" y="499" width="1046" height="23" fill="#ffffff"/>
  <text x="45" y="514" font-size="11" font-weight="600" fill="#1e293b">MRET Instructions Executed</text>
  <text x="350" y="514" font-size="11" font-weight="600" fill="#0369a1">4 Executions</text>
  <text x="650" y="514" font-size="11" fill="#475569">Resumed PC after faulting instruction</text>
  <text x="950" y="514" font-size="11" font-weight="700" fill="#16a34a">PASS (Zero Hangs)</text>


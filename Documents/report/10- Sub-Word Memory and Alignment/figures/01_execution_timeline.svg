    <text x="462" y="278" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">Cycles 526 - 575</text>
    <text x="43" y="297" font-size="11" fill="#475569">SH to 0x80000401; data_misaligned=1; mcause=6; mtval=0x80000401; MRET resumed</text>
  </g>

  <g filter="url(#shadow)">

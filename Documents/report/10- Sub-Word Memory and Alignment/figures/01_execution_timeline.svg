    <text x="462" y="108" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">Cycles 310 - 350</text>
    <text x="43" y="127" font-size="11" fill="#475569">SB, SH byte enables; LB, LBU, LH, LHU sign/zero extensions verified 100%</text>
  </g>

  <g filter="url(#shadow)">

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<defs>
  <style type="text/css">
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .sig-lbl { font-size: 11px; font-weight: 600; fill: #1e293b; }
    .sig-sub { font-size: 9px; fill: #64748b; }
    .cyc-lbl { font-size: 10px; fill: #475569; text-anchor: middle; }
    .box-lbl { font-size: 10px; font-weight: 600; text-anchor: middle; }
    .ann-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .ann-body { font-size: 10px; fill: #334155; }
  </style>
</defs>
<rect width="1200" height="480" fill="#f8fafc" />
<rect x="20" y="15" width="1160" height="42" rx="8" fill="#1e293b" />
<text x="35" y="41" fill="#f8fafc" font-size="15" font-weight="700">CVA6 Memory Ordering: Memory WAR &amp; Store-to-Load Bypass Mechanics</text>
<text x="1165" y="41" fill="#94a3b8" font-size="11" text-anchor="end">Store Buffer Serialization | Zero-Stall Bypass | Address Aliasing</text>
<rect x="50" y="85" width="530" height="310" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
<rect x="50" y="85" width="530" height="32" rx="8" fill="#f1f5f9" />
<text x="65" y="106" font-size="12" font-weight="700" fill="#0f172a">Memory WAR (Write-After-Read in Store Buffer)</text>
<rect x="62" y="130" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="72" y="146" font-size="10.5" font-weight="700" fill="#1e293b">Step 1: Initial Store</text>
<text x="72" y="162" font-size="9.5" font-weight="600" fill="#2563eb">SW gp, 0(sp)  # [0x8000_0200] = 1000</text>
<text x="72" y="177" font-size="8.5" fill="#64748b">Value 1000 written into memory location via Store Buffer.</text>
<rect x="62" y="192" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="72" y="208" font-size="10.5" font-weight="700" fill="#1e293b">Step 2: Read Old Value (Load)</text>
<text x="72" y="224" font-size="9.5" font-weight="600" fill="#2563eb">LW a6, 0(sp)  # Must receive 1000</text>
<text x="72" y="239" font-size="8.5" fill="#64748b">Load issues immediately, reading 1000 from cache/store buffer.</text>
<rect x="62" y="254" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="72" y="270" font-size="10.5" font-weight="700" fill="#1e293b">Step 3: Immediate Store (WAR Hazard)</text>
<text x="72" y="286" font-size="9.5" font-weight="600" fill="#2563eb">SW tp, 0(sp)  # [0x8000_0200] = 10</text>
<text x="72" y="301" font-size="8.5" fill="#64748b">Store targeting the EXACT same address issues in the immediate next cycle!</text>
<rect x="62" y="316" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="72" y="332" font-size="10.5" font-weight="700" fill="#1e293b">Step 4: Read New Value</text>
<text x="72" y="348" font-size="9.5" font-weight="600" fill="#2563eb">LW a7, 0(sp)  # Must receive 10</text>
<text x="72" y="363" font-size="8.5" fill="#64748b">Subsequent load observes updated value 10 after store is established.</text>
<rect x="620" y="85" width="530" height="310" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
<rect x="620" y="85" width="530" height="32" rx="8" fill="#f1f5f9" />
<text x="635" y="106" font-size="12" font-weight="700" fill="#0f172a">Store-to-Load Forwarding (RAW in Store Buffer)</text>
<rect x="632" y="130" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="642" y="146" font-size="10.5" font-weight="700" fill="#1e293b">Step 1: Store Word to Memory Buffer</text>
<text x="642" y="162" font-size="9.5" font-weight="600" fill="#16a34a">SW s2, 4(sp)  # s2 = 0x12345678</text>
<text x="642" y="177" font-size="8.5" fill="#64748b">Instruction commits and places data into the Store Buffer FIFO.</text>
<rect x="632" y="192" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="642" y="208" font-size="10.5" font-weight="700" fill="#1e293b">Step 2: Immediate Load from Same Address</text>
<text x="642" y="224" font-size="9.5" font-weight="600" fill="#16a34a">LW s3, 4(sp)  # Immediate dependent read</text>
<text x="642" y="239" font-size="8.5" fill="#64748b">Load address matches pending Store Buffer entry at 0x8000_0204.</text>
<rect x="632" y="254" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="642" y="270" font-size="10.5" font-weight="700" fill="#1e293b">Step 3: LSU Store Buffer Bypass Hit</text>
<text x="642" y="286" font-size="9.5" font-weight="600" fill="#16a34a">LSU Bypass: Data forwarded directly to Load</text>
<text x="642" y="301" font-size="8.5" fill="#64748b">Load unit retrieves 0x12345678 WITHOUT waiting for D-cache write!</text>
<rect x="632" y="316" width="506" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
<text x="642" y="332" font-size="10.5" font-weight="700" fill="#1e293b">Step 4: Verification Result</text>
<text x="642" y="348" font-size="9.5" font-weight="600" fill="#16a34a">s3 = 0x12345678 (100% Match, 0 Corruption)</text>
<text x="642" y="363" font-size="8.5" fill="#64748b">Demonstrates full Store Buffer forwarding functionality in CVA6.</text>
<rect x="50" y="410" width="1100" height="55" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1" />
<text x="65" y="430" font-size="10.5" font-weight="700" fill="#854d0e">PQC Hardware Accelerator Guidance (Memory Ordering &amp; Store Buffer Bypass):</text>
<text x="65" y="448" font-size="9.5" fill="#713f12">In NTT polynomial multiplication loops, temporary coefficient store-load sequences benefit directly from Store Buffer forwarding, eliminating D-cache round-trip delays.</text>
</svg>
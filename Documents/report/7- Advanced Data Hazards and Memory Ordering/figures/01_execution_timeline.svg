<rect x="55.0" y="205" width="356.6666666666667" height="85" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
<text x="65.0" y="223" font-size="11" font-weight="700" fill="#c2410c">WAW Hazard Resolution (Phase 1 &amp; 2)</text>
<text x="65.0" y="241" font-size="9" fill="#334155">• Long-latency DIV completes AFTER fast ADDI.</text>
<text x="65.0" y="257" font-size="9" fill="#334155">• In-order commit enforces DIV retires first, ADDI second (x10=99).</text>
<text x="65.0" y="273" font-size="9" fill="#334155">• raw_checker directs consumer to youngest producer (x11=99, x15=77).</text>
<rect x="421.6666666666667" y="205" width="356.6666666666667" height="85" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
<text x="431.6666666666667" y="223" font-size="11" font-weight="700" fill="#15803d">Memory WAR &amp; Store Buffer RAW (Phase 3 &amp; 4)</text>
<text x="431.6666666666667" y="241" font-size="9" fill="#334155">• Memory WAR: LW reads old 1000 before immediate SW writes 10.</text>
<text x="431.6666666666667" y="257" font-size="9" fill="#334155">• Store-to-Load Forwarding: SW bypasses directly from Store Buffer to LW.</text>
<text x="431.6666666666667" y="273" font-size="9" fill="#334155">• Zero D-cache wait cycles on store-buffer forwarding bypass.</text>
<rect x="788.3333333333334" y="205" width="356.6666666666667" height="85" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" />
<text x="798.3333333333334" y="223" font-size="11" font-weight="700" fill="#7e22ce">Sub-Word LSU &amp; Reg x0 Invariance (Phase 5 &amp; 6)</text>
<text x="798.3333333333334" y="241" font-size="9" fill="#334155">• Signed LB (-35) vs Unsigned LBU (221) accurately extended.</text>
<text x="798.3333333333334" y="257" font-size="9" fill="#334155">• Signed LH (-13091) vs Unsigned LHU (52445) accurately extended.</text>
<text x="798.3333333333334" y="273" font-size="9" fill="#334155">• Reg x0: DIV/LW/ADDI to x0 discarded; zero stalls; x0 strictly 0.</text>
<rect x="50" y="305" width="1100" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
<text x="70" y="328" font-size="12" font-weight="700" fill="#15803d">Architectural Scoreboard &amp; Hazard Verification (22/22 Checks PASSED):</text>
<text x="70" y="348" font-size="10.5" fill="#166534">✓ WAW Out-of-Order Execution: DIV takes 8 cycles, ADDI takes 1 cycle; Scoreboard in-order commit guarantees x10=99 and x13=77.</text>
<text x="70" y="366" font-size="10.5" fill="#166534">✓ Memory Ordering &amp; Bypass: Memory WAR prevents stale loads; Store Buffer RAW forwards 0x12345678 without D-cache stalls.</text>
<text x="70" y="384" font-size="10.5" fill="#166534">✓ Sub-word &amp; Reg x0: Sign/zero extensions verified; operations targeting x0 incur 0 stalls and x0 remains strictly hardwired to 0.</text>

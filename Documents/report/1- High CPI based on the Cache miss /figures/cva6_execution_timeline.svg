<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 13px; fill: #64748b; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 11px; fill: #334155; font-weight: bold; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 12px; fill: #ffffff; font-weight: bold; text-anchor: middle; }
    .badge-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 10px; fill: #f1f5f9; text-anchor: middle; }
    .legend-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 12px; fill: #0f172a; font-weight: bold; }
    .legend-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Arial, sans-serif; font-size: 11px; fill: #475569; }
  </style>
</defs>
<rect width="1200" height="470" fill="#fdfdfd" rx="8" stroke="#e2e8f0" stroke-width="1"/>
<text x="600.0" y="32" class="title" text-anchor="middle">CVA6 Core Execution Lifecycle (Cycles 0 to 344)</text>
<text x="600.0" y="50" class="subtitle" text-anchor="middle">Microarchitectural Phase Breakdown: 256-Cycle Tag Flush, Cache Refills, and Instruction Execution</text>
<rect x="80" y="90" width="1060" height="60" fill="#f1f5f9" rx="4"/>
<rect x="80.0" y="90" width="30.8" height="60" fill="#e74c3c" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="95.4" y="124.0" class="badge-text">P1</text>
<rect x="110.8" y="90" width="785.8" height="60" fill="#e67e22" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="503.7" y="115.0" class="badge-text">[P2] I-Cache Tag Flush</text>
<text x="503.7" y="132.0" class="badge-sub">255 Cycles [10..265]</text>
<rect x="896.6" y="90" width="21.6" height="60" fill="#f39c12" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="907.4" y="124.0" class="badge-text" font-size="10px">3</text>
<rect x="918.1" y="90" width="24.7" height="60" fill="#27ae60" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="930.5" y="124.0" class="badge-text" font-size="10px">4</text>
<rect x="942.8" y="90" width="49.3" height="60" fill="#2980b9" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="967.4" y="124.0" class="badge-text">P5</text>
<rect x="992.1" y="90" width="46.2" height="60" fill="#8e44ad" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="1015.2" y="124.0" class="badge-text">P6</text>
<rect x="1038.3" y="90" width="27.7" height="60" fill="#16a085" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="1052.2" y="124.0" class="badge-text" font-size="10px">7</text>
<rect x="1066.0" y="90" width="74.0" height="60" fill="#34495e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
<text x="1103.0" y="124.0" class="badge-text">P8</text>
<line x1="80" y1="150" x2="1140" y2="150" stroke="#64748b" stroke-width="2"/>
<line x1="80.0" y1="150" x2="80.0" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="80.0" y="168" class="axis-label" text-anchor="middle">C0</text>
<line x1="110.8" y1="150" x2="110.8" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="110.8" y="168" class="axis-label" text-anchor="middle">C10</text>
<line x1="234.1" y1="150" x2="234.1" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="234.1" y="168" class="axis-label" text-anchor="middle">C50</text>
<line x1="388.1" y1="150" x2="388.1" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="388.1" y="168" class="axis-label" text-anchor="middle">C100</text>
<line x1="542.2" y1="150" x2="542.2" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="542.2" y="168" class="axis-label" text-anchor="middle">C150</text>
<line x1="696.3" y1="150" x2="696.3" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="696.3" y="168" class="axis-label" text-anchor="middle">C200</text>
<line x1="868.8" y1="150" x2="868.8" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="868.8" y="168" class="axis-label" text-anchor="middle">C256</text>
<line x1="942.8" y1="150" x2="942.8" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="942.8" y="168" class="axis-label" text-anchor="middle">C280</text>
<line x1="1041.4" y1="150" x2="1041.4" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="1041.4" y="168" class="axis-label" text-anchor="middle">C312</text>
<line x1="1140.0" y1="150" x2="1140.0" y2="156" stroke="#64748b" stroke-width="1.5"/>
<text x="1140.0" y="168" class="axis-label" text-anchor="middle">C344</text>
<text x="80" y="192" class="axis-label" font-size="13px">Summary of Execution Phases (P1 to P8):</text>
<rect x="80" y="210" width="16" height="16" fill="#e74c3c" rx="3"/>
<text x="88" y="222" class="badge-text" font-size="10px">P1</text>
<text x="104" y="221" class="legend-title">Reset Assertion (Cycles 0 to 10)</text>
<text x="104" y="234" class="legend-desc">Active-low reset (rst_ni=0); pipeline registers and control flags cleared</text>
<rect x="620" y="210" width="16" height="16" fill="#e67e22" rx="3"/>
<text x="628" y="222" class="badge-text" font-size="10px">P2</text>
<text x="644" y="221" class="legend-title">I-Cache Tag Flush (Cycles 10 to 265)</text>
<text x="644" y="234" class="legend-desc">Hardware clears 256 Tag SRAM rows sequentially; asserts flush_done=1 at C265</text>
<rect x="80" y="244" width="16" height="16" fill="#f39c12" rx="3"/>
<text x="88" y="256" class="badge-text" font-size="10px">P3</text>
<text x="104" y="255" class="legend-title">Cold Miss Refill (Cycles 265 to 272)</text>
<text x="104" y="268" class="legend-desc">First compulsory miss at 0x80000000; 2-beat 64-bit AXI refill; line written at C271</text>
<rect x="620" y="244" width="16" height="16" fill="#27ae60" rx="3"/>
<text x="628" y="256" class="badge-text" font-size="10px">P4</text>
<text x="644" y="255" class="legend-title">Initial ALU Burst (Cycles 272 to 280)</text>
<text x="644" y="268" class="legend-desc">ADDI, ADD, SUB retired in 5 cycles from filled cache line (Instant CPI = 1.25)</text>
<rect x="80" y="278" width="16" height="16" fill="#2980b9" rx="3"/>
<text x="88" y="290" class="badge-text" font-size="10px">P5</text>
<text x="104" y="289" class="legend-title">Refills &amp; Logic Ops (Cycles 280 to 296)</text>
<text x="104" y="302" class="legend-desc">Lines 1 &amp; 2 refilled; XOR, OR, AND, SLTI, SLLI retired (Instant CPI = 1.00)</text>
<rect x="620" y="278" width="16" height="16" fill="#8e44ad" rx="3"/>
<text x="628" y="290" class="badge-text" font-size="10px">P6</text>
<text x="644" y="289" class="legend-title">Data Memory SW/LW (Cycles 296 to 311)</text>
<text x="644" y="302" class="legend-desc">Store word 30 at addr 256 (SW); Load word 30 into x10 (LW) via AXI bus</text>
<rect x="80" y="312" width="16" height="16" fill="#16a085" rx="3"/>
<text x="88" y="324" class="badge-text" font-size="10px">P7</text>
<text x="104" y="323" class="legend-title">Branch BEQ &amp; Jump JAL (Cycles 311 to 320)</text>
<text x="104" y="336" class="legend-desc">BEQ resolved taken (skips 0x30); JAL taken to 0x40 (skips 0x3c)</text>
<rect x="620" y="312" width="16" height="16" fill="#34495e" rx="3"/>
<text x="628" y="324" class="badge-text" font-size="10px">P8</text>
<text x="644" y="323" class="legend-title">Drain &amp; Steady Loop (Cycles 320 to 344)</text>
<text x="644" y="336" class="legend-desc">Speculative overshoot at 0x50 killed; terminal BEQ self-loop hits at 100%</text>
</svg>
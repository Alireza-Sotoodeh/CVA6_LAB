<rect x="130" y="110" width="280" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" opacity="0.9" />
<line x1="140" y1="126" x2="165" y2="126" stroke="#2563eb" stroke-width="3" />
<circle cx="152" cy="126" r="4" fill="#2563eb" />
<text x="175" y="130" font-size="9.5" font-weight="600" fill="#0f172a">Measured CVA6 (L1 Cache Hit Immunity)</text>
<line x1="140" y1="146" x2="165" y2="146" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
<circle cx="152" cy="146" r="3" fill="#dc2626" />
<text x="175" y="150" font-size="9.5" font-weight="600" fill="#dc2626">Theoretical Uncached Memory Stalling</text>
<rect x="620" y="90" width="450" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
<rect x="620" y="90" width="450" height="32" rx="8" fill="#f1f5f9" />
<text x="635" y="111" font-size="12" font-weight="700" fill="#0f172a">Cache Hit &amp; Latency Masking Breakdown</text>
<text x="635" y="140" font-size="10.5" font-weight="700" fill="#1e293b">1. Iteration 1 Cold Start (Wait = 0 cyc, CPI = 1.33):</text>
<text x="635" y="156" font-size="9.5" fill="#475569" width="420">First time executing loop: Initial cold miss on I-Cache line and D-Cac</text>
<text x="635" y="169" font-size="9.5" fill="#475569">he buffer [0x80000200] creates brief linefill latency before stabilizing at 1.33 CPI.</text>
<text x="635" y="194" font-size="10.5" font-weight="700" fill="#1e293b">2. Iteration 2 (Wait = 4 cyc, CPI = 1.00):</text>
<text x="635" y="210" font-size="9.5" fill="#475569" width="420">Data line is already resident in L1 D-Cache. The SW writes into Store </text>
<text x="635" y="223" font-size="9.5" fill="#475569">Buffer, and LW hits immediately in cache/store buffer bypass. 4-cycle AXI wait has 0 penalty!</text>
<text x="635" y="248" font-size="10.5" font-weight="700" fill="#1e293b">3. Iteration 3 (Wait = 8 cyc, CPI = 1.00):</text>
<text x="635" y="264" font-size="9.5" fill="#475569" width="420">Complete immunity confirmed: Even doubling external memory wait states</text>
<text x="635" y="277" font-size="9.5" fill="#475569"> to 8 cycles, core commits all 13 instructions in exactly 13 cycles with 2 dual-commits.</text>
<text x="635" y="302" font-size="10.5" font-weight="700" fill="#1e293b">4. Iteration 4 (Wait = 16 cyc, CPI = 1.00):</text>
<text x="635" y="318" font-size="9.5" fill="#475569" width="420">16-cycle external delay is 100% hidden by cache hit rate. Highlights c</text>
<text x="635" y="331" font-size="9.5" fill="#475569">rucial architectural lesson: L1 cache resident loops sustain maximum pipeline throughput.</text>
<rect x="20" y="375" width="600" height="65" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1" />
<text x="35" y="395" font-size="10.5" font-weight="700" fill="#854d0e">PQC Accelerator Guidance (Dr. Mahani Project):</text>
<text x="35" y="412" font-size="9.5" fill="#713f12">For NTT / polynomial multiplication, keeping working coefficients within L1 D-Cache prevents any AXI latency degradation, allowing sustained dual-commit throughput near IPC 1.0-2.0.</text>

<text x="280" y="348" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">4 cyc</text>
<text x="280" y="360" font-size="8.5" fill="#64748b" text-anchor="middle">Iter 2 (Warm)</text>

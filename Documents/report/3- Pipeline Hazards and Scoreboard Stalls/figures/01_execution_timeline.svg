  <text x="55" y="208" class="sig-lbl">Phase</text>
  <text x="250" y="208" class="sig-lbl">Cycle Span</text>
  <text x="350" y="208" class="sig-lbl">Microarchitectural Mechanism</text>
  <text x="750" y="208" class="sig-lbl">Hardware Signals &amp; Evidence</text>
  <text x="1030" y="208" class="sig-lbl">Measured CPI / Impact</text>
  <text x="55" y="234" font-size="10" font-weight="600" fill="#1e293b">Phase 1: RAW ALU Forwarding</text>
  <text x="250" y="234" font-size="10" fill="#475569">267 – 280</text>
  <text x="350" y="234" font-size="10" fill="#334155">Scoreboard operand bypass directly from EX writeback</text>
  <text x="750" y="234" font-size="10" font-family="monospace" fill="#0369a1">forward_rs1=1, forward_rs2=1, stall_raw=0</text>
  <text x="1030" y="234" font-size="10" font-weight="600" fill="#047857">CPI = 1.00 (Zero stall bubbles)</text>
  <text x="55" y="254" font-size="10" font-weight="600" fill="#1e293b">Phase 2: Load-Use Scoreboard Stall</text>
  <text x="250" y="254" font-size="10" fill="#475569">281 – 305</text>
  <text x="350" y="254" font-size="10" fill="#334155">D-cache latency stalls consumer instruction</text>
  <text x="750" y="254" font-size="10" font-family="monospace" fill="#0369a1">stall_raw=1, stall_rs1=1, issue_ack=0</text>
  <text x="1030" y="254" font-size="10" font-weight="600" fill="#047857">19 stall cycles while awaiting LW</text>
  <text x="55" y="274" font-size="10" font-weight="600" fill="#1e293b">Phase 3: Store Buffer Collision</text>
  <text x="250" y="274" font-size="10" fill="#475569">306 – 325</text>
  <text x="350" y="274" font-size="10" fill="#334155">Store-to-Load address alias (same page offset)</text>
  <text x="750" y="274" font-size="10" font-family="monospace" fill="#0369a1">page_offset_matches=1, state_q=WAIT_PAGE_OFFSET</text>
  <text x="1030" y="274" font-size="10" font-weight="600" fill="#047857">4 stall cycles until store drains</text>
  <text x="55" y="294" font-size="10" font-weight="600" fill="#1e293b">Phase 4: DIV Structural Contention</text>
  <text x="250" y="294" font-size="10" fill="#475569">326 – 345</text>
  <text x="350" y="294" font-size="10" fill="#334155">Fixed-Latency Unit (FLU) blocked by serial divider</text>
  <text x="750" y="294" font-size="10" font-family="monospace" fill="#0369a1">flu_ready=0, fus_busy[0].alu=1, in_rdy_o=0</text>
  <text x="1030" y="294" font-size="10" font-weight="600" fill="#047857">14 stall cycles on independent ALUs</text>
  <text x="55" y="314" font-size="10" font-weight="600" fill="#1e293b">Phase 5: MUL &amp; Terminal Self-Loop</text>
  <text x="250" y="314" font-size="10" fill="#475569">346 – 389</text>
  <text x="350" y="314" font-size="10" fill="#334155">Single-cycle multiplier execution &amp; self-loop commit</text>
  <text x="750" y="314" font-size="10" font-family="monospace" fill="#0369a1">mul_valid=1, commit_pc=0x8000_006c at cyc 349</text>
  <text x="1030" y="314" font-size="10" font-weight="600" fill="#047857">Active CPI across hazard run = 2.02</text>
